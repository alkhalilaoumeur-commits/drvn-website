<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="#050814"/>

  <!-- Subtle radial glow -->
  <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:0.12"/>
    <stop offset="100%" style="stop-color:#050814;stop-opacity:0"/>
  </radialGradient>
  <rect width="400" height="400" fill="url(#bgGlow)"/>

  <!-- Geometric accent: thin corner lines -->
  <line x1="32" y1="32" x2="80" y2="32" stroke="url(#grad)" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="32" y1="32" x2="32" y2="80" stroke="url(#grad)" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="368" y1="368" x2="320" y2="368" stroke="url(#grad)" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="368" y1="368" x2="368" y2="320" stroke="url(#grad)" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- DRVN wordmark -->
  <text
    x="200"
    y="222"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-weight="900"
    font-size="108"
    letter-spacing="8"
    text-anchor="middle"
    fill="url(#gradText)"
    filter="url(#glow)"
  >DRVN</text>

  <!-- Tagline -->
  <text
    x="200"
    y="268"
    font-family="'Arial', 'Helvetica Neue', Arial, sans-serif"
    font-weight="400"
    font-size="16"
    letter-spacing="5"
    text-anchor="middle"
    fill="rgba(255,255,255,0.35)"
  >AUTOMATISIERUNGEN</text>

  <!-- Bottom accent dot -->
  <circle cx="200" cy="308" r="3" fill="url(#grad)" opacity="0.8"/>
</svg>
